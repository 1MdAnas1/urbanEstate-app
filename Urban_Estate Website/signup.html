    <script>
        function validate(form){
          fail=valname(form.suser.value);
          fail+=valmail(form.smail.value);
          fail+=valpass(form.spass.value);
          fail+=valphone(form.sphone.value);

          if(fail=="")
            return true;
         else
           { alert(fail);
            return false;
           }
        }
        function  valname(field){
                if(field=="") 
                return "Username can not be empty\n";
                else 
                return "";
        }
        function valmail(field)
        {
            if (field == "")
               return "No email entered\n"
            else if ( !(((field.indexOf(".") > 0) && (field.indexOf("@") > 0)) || /[^a-zA-Z0-9.@_-]/.test(field) ))
               return "E-mail Address INVALID\n"
    
               return ""
        }
        function valpass(field)
        {
            if(field=="") 
                return "Password can not be empty\n";
                else if(field.length<8)
                return "Password must be atleast 8 characters\n";
                return "";
        }
        function valphone(field)
        {
            if(field=="") 
                return "Phone Number can not be empty\n";
                else if(isNaN(field))
                return "Only numbers(0-9) are allowed\n";
                else if(field.length<10)
                return "Phone number must be of 10 characters\n";
                else if(field.length>10)
                return "Phone number must be of 10 characters\n";
                return "";                
        }
    </script>
