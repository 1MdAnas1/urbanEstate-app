    <script>
        function validate(form){
          fail=valname(form.suser.value);
          fail+=valmail(form.smail.value);
          fail+=valsubject(form.ssubject.value);
          fail+=valmessage(form.smessage.value);

          if(fail=="")
            return true;
         else
           { alert(fail);
            return false;
           }
        }
        function  valname(field){
                if(field=="") 
                return "Name can not be empty\n";
                else 
                return "";
        }
        function valmail(field)
        {
            if (field == "")
               return "No email entered\n"
            else if ( !(((field.indexOf(".") > 0) && (field.indexOf("@") > 0)) || /[^a-zA-Z0-9.@_-]/.test(field) ))
               return "E-mail Address INVALID\n"
    
               return ""
        }
        function valsubject(field)
        {
            if(field=="") 
                return "Subject can not be empty\n";
                else if(field.length<5)
                return "Subject must be atleast 5 characters\n";
                return "";
        }
        function valmessage(field)
        {
            if(field=="") 
                return "Message can not be empty\n";        
                else if(field.length<10)
                return "Message must be of 10 characters\n";
                                
                return "";

                
        }
    </script>
